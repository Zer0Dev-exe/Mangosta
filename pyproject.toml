[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangosta"
version = "0.1.0"
description = "Gestiona MongoDB (self-hosted y Atlas) desde la terminal: bases de datos, usuarios, roles, acceso por IP, clusters y más."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pymongo>=4.6",
    "requests>=2.31",
    "textual>=0.80",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mangosta = "mangosta.cli:main"
mgs = "mangosta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mangosta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
